<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖嬰現象(ENSO) 3D海氣互動模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000b18; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #333; }
        
        .panel { pointer-events: auto; z-index: 100; position: absolute; }
        .drag-handle { cursor: move; user-select: none; border-bottom: 2px solid #2a9d8f; padding-bottom: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .drag-handle::before { content: '⠿'; color: #ccc; margin-right: 8px; font-size: 1.2em; }
        .drag-title-text { flex-grow: 1; font-size: 1.1rem; color: #003566; font-weight: bold; margin: 0; }

        #ui-panel { top: 15px; left: 15px; background: rgba(240, 248, 255, 0.95); padding: 15px 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 360px; }
        
        .stage-badge { display: inline-block; padding: 6px 14px; margin-bottom: 10px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; color: #fff; transition: background 0.5s; text-align: center; width: calc(100% - 28px); }
        .normal-stage { background: #2a9d8f; } 
        .elnino-stage { background: #e76f51; } 
        .lanina-stage { background: #0077b6; }
        .paused-badge { background-color: #e63946; border: 1px solid #fff; padding: 2px 6px; border-radius: 6px; font-size: 0.8rem; margin-left: 10px; animation: blink 1.5s infinite; vertical-align: middle;}

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .status-box { padding: 12px; border-radius: 8px; background: #fff; border-left: 5px solid #ccc; transition: all 0.3s ease; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        #status-text { font-size: 0.95rem; color: #333; line-height: 1.6; }
        .status-highlight { font-weight: bold; font-size: 1.1em; }

        #chart-container { bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 420px; height: 240px; }
        .chart-drag-handle { cursor: move; font-size: 0.9rem; color: #003566; font-weight: bold; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 4px; user-select: none; }

        #data-log-panel { top: 15px; right: 20px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 420px; max-height: 250px; overflow-y: auto; }
        .log-title { font-size: 0.95rem; font-weight: bold; color: #003566; margin-bottom: 8px; border-bottom: 2px solid #2a9d8f; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none;}
        .log-btn { background: #2a9d8f; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .log-btn:hover { background: #21867a; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
        th { background: #e9ecef; padding: 6px; position: sticky; top: 0; }
        td { padding: 6px; border-bottom: 1px solid #eee; }
        tr:nth-child(even) { background: #f8f9fa; }
        tr:hover { background: #e2e6ea; }

        .sst-legend { margin-top: 15px; font-size: 0.85rem; font-weight: bold; }
        .gradient-bar { height: 12px; width: 100%; background: linear-gradient(to right, #0044ff, #00ccff, #ffff00, #ff6600, #ff0000); border-radius: 6px; margin-top: 5px; }
        .legend-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #555; margin-top: 2px; }

        .geo-label { position: absolute; color: white; font-weight: bold; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; transform: translate(-50%, -50%); opacity: 0.8; z-index: 5; }

        .dg.main { margin-top: 15px !important; }
        @media (max-width: 900px) { #chart-container, #data-log-panel { display: none !important; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="label-west" class="geo-label">西太平洋<br>(印尼 / 澳洲)</div>
    <div id="label-east" class="geo-label">東太平洋<br>(南美洲)</div>
    <!-- 新增湧升流文字標籤 -->
    <div id="label-upwell" class="geo-label" style="color: #48cae4; text-shadow: 0 0 10px #48cae4, 0 2px 4px #000; font-size: 1.3rem;">🌊 湧升流</div>

    <div id="ui-panel" class="panel">
        <div class="drag-handle" id="ui-drag-handle"><h1 class="drag-title-text">ENSO 海氣互動模擬器</h1></div>
        <div id="stage-badge-container">
            <div id="stage-badge" class="stage-badge normal-stage">正常年 (Normal)</div>
        </div>
        <div class="status-box" id="status-container">
            <div id="status-text">
                海洋尼諾指數 (ONI): <span id="val-oni" class="status-highlight">0.0</span> °C<br>
                東太平洋海溫異常: <span id="val-sst" class="status-highlight">0.0</span> °C<br>
                信風狀態: <span id="val-wind" class="status-highlight">正常偏東風</span><br>
                氣象特徵: <span id="val-weather" style="color:#0077b6; font-weight:bold;">西側降雨、東側湧升流</span>
            </div>
        </div>
        <div class="sst-legend">
            海表溫度 (SST) 示意圖例
            <div class="gradient-bar"></div>
            <div class="legend-labels"><span>冷 (湧升流)</span><span>正常</span><span>暖 (暖水池)</span></div>
        </div>
    </div>

    <div id="data-log-panel" class="panel">
        <div class="log-title" id="log-drag-handle">
            <span>⠿ 海氣象科學觀測紀錄</span>
            <button class="log-btn" onclick="exportCSV()">匯出 CSV</button>
        </div>
        <table id="log-table">
            <thead><tr><th>時間(月)</th><th>ONI 指數</th><th>東太平洋 ΔSST</th><th>信風狀態</th><th>狀態判定</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="chart-container" class="panel">
        <div class="chart-drag-handle" id="chart-drag-handle">⠿ ENSO 實時監測時序圖</div>
        <canvas id="ensoChart"></canvas>
    </div>

    <script>
        // --- UI 拖曳功能 ---
        function makeDraggable(elmnt, handleId) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0; const handle = document.getElementById(handleId);
            if (handle) { handle.onmousedown = dragMouseDown; handle.ontouchstart = dragTouchStart; }
            function dragMouseDown(e) { if(e.target.tagName === 'BUTTON') return; e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function dragTouchStart(e) { if(e.target.tagName === 'BUTTON') return; const touch = e.touches[0]; pos3 = touch.clientX; pos4 = touch.clientY; document.ontouchend = closeDragElement; document.ontouchmove = elementTouchDrag; }
            function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; }
            function elementTouchDrag(e) { pos1 = pos3 - e.touches[0].clientX; pos2 = pos4 - e.touches[0].clientY; pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
        }
        makeDraggable(document.getElementById("ui-panel"), "ui-drag-handle"); 
        makeDraggable(document.getElementById("data-log-panel"), "log-drag-handle"); 
        makeDraggable(document.getElementById("chart-container"), "chart-drag-handle");

        // --- 全域模擬參數 ---
        const params = {
            targetONI: 0.0,
            currentONI: 0.0,
            transitionSpeed: 0.02,
            isPaused: false,
            autoRecord: true,
            showAir: true,
            showCloudsRain: true,
            showThermocline: true,
            setLaNina: () => { params.targetONI = -2.5; },
            setNormal: () => { params.targetONI = 0.0; },
            setElNino: () => { params.targetONI = 2.8; }
        };

        let frameCount = 0;
        let simMonth = 0;

        // --- Three.js 場景初始化 ---
        const scene = new THREE.Scene(); 
        scene.background = new THREE.Color('#001020'); 
        scene.fog = new THREE.FogExp2('#001020', 0.003);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 1000); 
        camera.position.set(0, 70, 180);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true }); 
        renderer.setPixelRatio(window.devicePixelRatio); 
        renderer.setSize(window.innerWidth, window.innerHeight); 
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(50, 100, 50); scene.add(dirLight);

        // --- 建立地形 ---
        function createLandmass(xPos, width, colorHex) {
            const geo = new THREE.BoxGeometry(width, 20, 60);
            const mat = new THREE.MeshPhongMaterial({ color: colorHex, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(xPos, 5, 0);
            scene.add(mesh);
        }
        createLandmass(-110, 20, 0x3d5a80); 
        createLandmass(110, 20, 0x8f7a66);

        // 標籤座標追蹤共用函式
        const tempV = new THREE.Vector3();
        function updateElem(elem, objX, objY, objZ) {
            if (!elem) return;
            tempV.set(objX, objY, objZ).project(camera);
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;
            if (tempV.z > 1) { elem.style.opacity = '0'; } 
            else { elem.style.opacity = '1'; elem.style.left = `${x}px`; elem.style.top = `${y}px`; }
        }

        function updateLabels() {
            updateElem(document.getElementById('label-west'), -110, 25, 0);
            updateElem(document.getElementById('label-east'), 110, 25, 0);
            
            // 湧升流標籤控制 (聖嬰年關閉)
            const labelUpwell = document.getElementById('label-upwell');
            if(params.currentONI < 0.5) {
                labelUpwell.style.display = 'block';
                updateElem(labelUpwell, 80, -10, 20); // 放在湧升流上方
            } else {
                labelUpwell.style.display = 'none';
            }
        }

        // --- 海洋系統 ---
        const OCEAN_WIDTH = 200;
        const OCEAN_DEPTH = 60;
        
        const sstCanvas = document.createElement('canvas');
        sstCanvas.width = 512; sstCanvas.height = 2;
        const sstCtx = sstCanvas.getContext('2d');
        const sstTexture = new THREE.CanvasTexture(sstCanvas);
        
        const oceanSurface = new THREE.Mesh(
            new THREE.PlaneGeometry(OCEAN_WIDTH, OCEAN_DEPTH, 1, 1),
            new THREE.MeshBasicMaterial({ map: sstTexture, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
        );
        oceanSurface.rotation.x = -Math.PI / 2;
        scene.add(oceanSurface);

        const thermocline = new THREE.Mesh(
            new THREE.PlaneGeometry(OCEAN_WIDTH, OCEAN_DEPTH, 50, 10),
            new THREE.MeshBasicMaterial({ color: 0x48cae4, wireframe: true, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
        );
        thermocline.rotation.x = -Math.PI / 2;
        scene.add(thermocline);

        const deepOcean = new THREE.Mesh(
            new THREE.BoxGeometry(OCEAN_WIDTH, 40, OCEAN_DEPTH),
            new THREE.MeshBasicMaterial({ color: 0x001d3d, transparent: true, opacity: 0.6 })
        );
        deepOcean.position.y = -20;
        scene.add(deepOcean);

        // ★ 新增：3D 湧升流立體箭頭群組
        const upwellArrows = new THREE.Group();
        const arrowMat = new THREE.MeshPhongMaterial({ color: 0x48cae4, transparent: true, opacity: 0.8, emissive: 0x0077b6 });
        for(let i=0; i<5; i++) {
            const arrow = new THREE.Group();
            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 12, 8), arrowMat);
            cylinder.position.y = 6;
            const cone = new THREE.Mesh(new THREE.ConeGeometry(3, 5, 8), arrowMat);
            cone.position.y = 12 + 2.5;
            arrow.add(cylinder); arrow.add(cone);
            
            // 隨機分佈在東側水底
            arrow.position.set(70 + Math.random()*15, -35 - Math.random()*15, (Math.random()-0.5)*20);
            arrow.userData = { origY: arrow.position.y, speedOffset: 0.5 + Math.random()*0.5 };
            upwellArrows.add(arrow);
        }
        scene.add(upwellArrows);


        function updateOceanVisuals(oni) {
            // 海溫漸層
            sstCtx.clearRect(0, 0, 512, 2);
            const grd = sstCtx.createLinearGradient(0, 0, 512, 0);
            let warmPoolEdge = Math.max(0.1, Math.min(0.9, 0.5 + (oni / 6)));
            grd.addColorStop(0, '#ff0000'); 
            grd.addColorStop(Math.max(0, warmPoolEdge - 0.2), '#ff6600');
            grd.addColorStop(warmPoolEdge, '#ffff00');
            grd.addColorStop(Math.min(1, warmPoolEdge + 0.2), '#00ccff');
            grd.addColorStop(1, '#0044ff'); 
            sstCtx.fillStyle = grd;
            sstCtx.fillRect(0, 0, 512, 2);
            sstTexture.needsUpdate = true;

            // 斜溫層變形
            const positions = thermocline.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                let normalizedX = (positions[i] + 100) / 200; 
                let depth = -25 + 20 * Math.tanh(2 * normalizedX + (oni*0.5));
                positions[i+2] = -Math.abs(depth); 
            }
            thermocline.geometry.attributes.position.needsUpdate = true;

            // ★ 更新湧升流立體箭頭
            let upwellStrength = Math.max(0, 1.0 - (oni / 1.5)); // Normal=1, LaNina=~2.6, ElNino=0
            if (upwellStrength > 0.1) {
                upwellArrows.visible = true;
                upwellArrows.children.forEach(arrow => {
                    // La Nina 速度快，Normal 速度一般
                    arrow.position.y += (oni < 0 ? 0.4 : 0.2) * arrow.userData.speedOffset;
                    if (arrow.position.y > -8) {
                        arrow.position.y = arrow.userData.origY; // 升到海面附近後重置到底部
                    }
                    // 根據強度調整箭頭大小
                    let scale = Math.min(2.0, upwellStrength);
                    arrow.scale.set(scale, scale, scale);
                });
            } else {
                upwellArrows.visible = false; // 聖嬰年完全隱藏湧升流
            }
        }

        // --- 粒子與雲系系統 ---
        const AIR_COUNT = 1500;
        const RAIN_COUNT = 800;

        // 沃克環流 (大氣粒子)
        const airGeo = new THREE.BufferGeometry();
        const airPos = new Float32Array(AIR_COUNT * 3);
        const airExtra = new Float32Array(AIR_COUNT * 3); 
        for(let i=0; i<AIR_COUNT; i++) {
            airExtra[i*3] = Math.random() * Math.PI * 2;
            airExtra[i*3+1] = (Math.random() - 0.5) * 15;
            airExtra[i*3+2] = (Math.random() - 0.5) * 30;
        }
        airGeo.setAttribute('position', new THREE.BufferAttribute(airPos, 3));
        airGeo.setAttribute('extra', new THREE.BufferAttribute(airExtra, 3));
        const airParticles = new THREE.Points(airGeo, new THREE.PointsMaterial({ color: 0xade8f4, size: 2.0, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
        scene.add(airParticles);

        // 實體 3D 雲群組
        const cloudGroup = new THREE.Group();
        const cloudGeo = new THREE.SphereGeometry(6, 16, 16);
        const cloudMat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.95 });
        for(let i=0; i<8; i++) {
            const mesh = new THREE.Mesh(cloudGeo, cloudMat);
            mesh.position.set((Math.random()-0.5)*25, Math.random()*12, (Math.random()-0.5)*15);
            mesh.scale.set(1 + Math.random(), 0.6 + Math.random()*0.4, 1 + Math.random());
            cloudGroup.add(mesh);
        }
        cloudGroup.position.y = 20;
        scene.add(cloudGroup);

        // 降雨系統
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(RAIN_COUNT * 3);
        for(let i=0; i<RAIN_COUNT; i++) {
            rainPos[i*3] = (Math.random() - 0.5) * 30;
            rainPos[i*3+1] = Math.random() * 20;
            rainPos[i*3+2] = (Math.random() - 0.5) * 20;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainParticles = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x00aaff, size: 2.0, transparent: true, opacity: 0.8, blending: THREE.NormalBlending, depthWrite: false }));
        cloudGroup.add(rainParticles);

        // 雙環流修正
        function updateAtmosphere(oni) {
            let convectionX = Math.max(-95, Math.min(60, -60 + (oni * 25)));

            if(params.showAir) {
                let wPos = airParticles.geometry.attributes.position.array;
                let wExtra = airParticles.geometry.attributes.extra.array;
                
                let loopEastCx = (convectionX + 85) / 2;
                let loopEastRx = Math.abs(85 - convectionX) / 2 + 5;
                
                let loopWestCx = (-95 + convectionX) / 2;
                let loopWestRx = Math.abs(convectionX - (-95)) / 2 + 5;

                let loopRy = 22;
                let eastSpeed = Math.max(0.005, 0.02 - (oni * 0.005));
                let westSpeed = Math.max(0.005, 0.02 + (oni * 0.005));

                for(let i=0; i<AIR_COUNT; i++) {
                    let isEastCell = (i < AIR_COUNT / 2);

                    if (isEastCell) {
                        wExtra[i*3] -= eastSpeed; 
                        let angle = wExtra[i*3];
                        let rOff = wExtra[i*3+1];
                        let zOff = wExtra[i*3+2];

                        wPos[i*3] = loopEastCx + Math.cos(angle) * (loopEastRx + rOff);
                        wPos[i*3+1] = 25 + Math.sin(angle) * (loopRy + rOff);
                        wPos[i*3+2] = zOff;
                    } else {
                        wExtra[i*3] += westSpeed; 
                        let angle = wExtra[i*3];
                        let rOff = wExtra[i*3+1];
                        let zOff = wExtra[i*3+2];

                        wPos[i*3] = loopWestCx + Math.cos(angle) * (loopWestRx + rOff);
                        wPos[i*3+1] = 25 + Math.sin(angle) * (loopRy + rOff);
                        wPos[i*3+2] = zOff;
                    }
                }
                airParticles.geometry.attributes.position.needsUpdate = true;
                airParticles.visible = true;
            } else { airParticles.visible = false; }

            if(params.showCloudsRain) {
                cloudGroup.position.x += (convectionX - cloudGroup.position.x) * 0.1;
                cloudGroup.position.y = 20 + Math.sin(frameCount * 0.05) * 1.5;

                let rPos = rainParticles.geometry.attributes.position.array;
                for(let i=0; i<RAIN_COUNT; i++) {
                    rPos[i*3+1] -= 1.0; 
                    if (rPos[i*3+1] < -20) { 
                        rPos[i*3] = (Math.random() - 0.5) * 35;
                        rPos[i*3+1] = 5 + Math.random() * 10;
                        rPos[i*3+2] = (Math.random() - 0.5) * 20;
                    }
                }
                rainParticles.geometry.attributes.position.needsUpdate = true;
                cloudGroup.visible = true;
            } else { cloudGroup.visible = false; }
        }

        // --- Chart.js 時序圖設定 ---
        const ctxChart = document.getElementById('ensoChart').getContext('2d');
        const ensoChart = new Chart(ctxChart, { 
            type: 'line', 
            data: { labels: [], datasets: [ { label: 'ONI 指數 (°C)', data: [], borderColor: '#ffca3a', backgroundColor: 'rgba(255,202,58,0.2)', fill: true, tension: 0.3 } ] }, 
            options: { 
                responsive: true, maintainAspectRatio: false, animation: { duration: 0 },
                plugins: { legend: { display: true, labels: { font: { size: 10 } } } }, 
                scales: { 
                    x: { display: true, ticks: { maxTicksLimit: 10, font: {size: 9} } }, 
                    y: { type: 'linear', display: true, min: -4, max: 4, grid: { color: (ctx) => ctx.tick.value === 0 ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.1)', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 } } 
                } 
            } 
        });

        // --- GUI 控制面板設定 ---
        const gui = new dat.GUI({ width: 320 });
        const f1 = gui.addFolder('1. 聖嬰現象情境切換');
        f1.add(params, 'setLaNina').name('❄️ 觸發：反聖嬰現象 (La Niña)');
        f1.add(params, 'setNormal').name('🌊 觸發：正常狀態 (Normal)');
        f1.add(params, 'setElNino').name('🔥 觸發：聖嬰現象 (El Niño)');
        f1.add(params, 'targetONI', -3, 3).name('手動調整 ONI 指數').listen();
        
        const f2 = gui.addFolder('2. 視覺化圖層開關');
        f2.add(params, 'showThermocline').name('顯示海底斜溫層');
        f2.add(params, 'showAir').name('顯示沃克雙環流 (3D風帶)');
        f2.add(params, 'showCloudsRain').name('顯示實體雲層與降雨');

        const f3 = gui.addFolder('3. 系統與時間控制');
        f3.add(params, 'isPaused').name('⏸️ 暫停模擬動畫');
        f3.add(params, 'autoRecord').name('📝 啟用實時觀測紀錄');
        
        f1.open(); f2.open(); f3.open();

        window.exportCSV = function() {
            let table = document.getElementById("log-table"); let rows = table.querySelectorAll("tr"); let csv = [];
            for (let i = 0; i < rows.length; i++) { let row = [], cols = rows[i].querySelectorAll("td, th"); for (let j = 0; j < cols.length; j++) row.push(cols[j].innerText); csv.push(row.join(",")); }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csv.join("\n"); let encodedUri = encodeURI(csvContent); let link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", "ENSO_Simulation_Data.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        function updateUIandLog() {
            const oni = params.currentONI;
            const sstAnomaly = oni * 0.8; 
            
            let stageClass = "normal-stage", stageName = "正常年 (Normal)", windDesc = "強勁偏東風 (東南信風)", weatherDesc = "西側多雨、東側湧升流豐富";
            if (oni > 0.5) { stageClass = "elnino-stage"; stageName = "聖嬰現象 (El Niño)"; windDesc = oni > 1.5 ? "異常偏西風爆發" : "信風極度減弱"; weatherDesc = "對流東移中太平洋，湧升流消失"; } 
            else if (oni < -0.5) { stageClass = "lanina-stage"; stageName = "反聖嬰現象 (La Niña)"; windDesc = "信風異常增強"; weatherDesc = "西側劇烈豪雨，東側極度寒冷乾燥"; }

            const pauseHTML = params.isPaused ? `<span class="paused-badge">暫停中</span>` : "";
            document.getElementById('stage-badge').className = "stage-badge " + stageClass;
            document.getElementById('stage-badge').innerHTML = stageName + pauseHTML;

            document.getElementById('val-oni').innerText = oni.toFixed(2);
            document.getElementById('val-sst').innerText = (sstAnomaly > 0 ? "+" : "") + sstAnomaly.toFixed(2);
            document.getElementById('val-wind').innerText = windDesc;
            document.getElementById('val-weather').innerText = weatherDesc;

            if (!params.isPaused && params.autoRecord && frameCount % 60 === 0) {
                simMonth++;
                let logTable = document.getElementById('log-table').getElementsByTagName('tbody')[0];
                let row = logTable.insertRow(0);
                if (logTable.rows.length > 30) logTable.deleteRow(30); 
                
                row.innerHTML = `<td>第 ${simMonth} 個月</td><td>${oni.toFixed(2)}</td><td>${sstAnomaly.toFixed(2)}</td><td>${windDesc.split(' ')[0]}</td><td>${stageName.split(' ')[0]}</td>`;
                
                ensoChart.data.labels.push('M' + simMonth);
                ensoChart.data.datasets[0].data.push(oni.toFixed(2));
                if (ensoChart.data.labels.length > 30) {
                    ensoChart.data.labels.shift();
                    ensoChart.data.datasets[0].data.shift();
                }
                ensoChart.update();
            }
        }

        // --- 主渲染迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            if (!params.isPaused) {
                frameCount++;
                params.currentONI += (params.targetONI - params.currentONI) * params.transitionSpeed;
                
                updateOceanVisuals(params.currentONI);
                updateAtmosphere(params.currentONI);
            }
            
            updateLabels();
            updateUIandLog();

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });

        animate();
    </script>
</body>
</html>
